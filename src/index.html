<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'self' blob:; worker-src 'self'"><title>LIFE LINE WaveDeck</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="file"><strong id="filename">未导入音频</strong><small id="filemeta">导入后显示真实波形</small></div><button id="open" class="primary">＋ 导入音频</button><input id="fileinput" type="file" accept="audio/*,.wav,.mp3,.m4a,.flac,.ogg,.aiff,.aif" hidden></header>
<main><div class="viewbar"><span id="channelbadge" class="badge">等待音频</span><div class="zoom"><span id="zoomlabel">全览</span><button id="fit" title="显示全部音频">全览</button></div></div><div id="wavearea"><canvas id="wave"></canvas><div id="cursor"><span></span></div><div id="empty"><div class="emptyicon">↥</div><h1>导入音频，开始播放</h1><p>将文件拖到这里，或点击「导入音频」</p><small>单声道一条波形 · 立体声 L / R 两条波形</small></div></div><div class="scrollbar"><span id="viewrange">—</span><input type="range" id="scroll" min="0" max="1000" value="0" aria-label="波形水平滚动"></div></main>
<section class="transport"><div class="meter-group"><div class="level"><span>输出电平</span><div class="meter"><i id="meterL"></i></div><div class="meter"><i id="meterR"></i></div><small id="levelname">L / R</small></div><div class="loudness" aria-label="源音频响度，单位 LUFS"><div title="最近 3 秒"><span>短期</span><strong id="loudnessS">—</strong><small>LUFS</small></div><div title="最近 400 毫秒"><span>瞬时</span><strong id="loudnessM">—</strong><small>LUFS</small></div><div title="播放期间累计综合响度；停止、定位或导入会重置"><span>平均</span><strong id="loudnessI">—</strong><small>LUFS</small></div></div></div><div class="center"><div class="buttons"><button id="home" title="归零（Backspace）" aria-label="归零">|◀</button><button id="back" title="后退 5 秒（←）" aria-label="后退">◀◀</button><button id="play" class="play" title="播放 / 暂停（空格）" aria-label="播放">▶</button><button id="forward" title="快进 5 秒（→）" aria-label="快进">▶▶</button><button id="loop" title="循环播放（L）" aria-label="循环播放" aria-pressed="false">↻</button></div><div class="time"><strong id="position">00:00.000</strong><span>/</span><span id="duration">00:00.000</span></div></div><div class="volume"><label for="volume">输出音量 <span id="volumevalue">30%</span></label><input id="volume" type="range" min="0" max="100" value="30"></div></section><footer><span id="status" role="status">就绪 · 音频仅在本机处理</span><span>滚轮 缩放　中键 拖动　空格 播放/暂停　← → 跳转　Backspace 归零</span></footer><script src="audio-core.js"></script><script src="drop-import.js"></script><script src="app.js"></script></body></html>
